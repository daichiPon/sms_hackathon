services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm start
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:3001
      WDS_SOCKET_PORT: "0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    init: true
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      target: development
    command:
      - sh
      - -c
      - npm run db:generate && npx prisma migrate deploy && npm run start:dev
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: file:/data/dev.db
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-https://example.com}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-replace_me}
      SMS_USER_REFERENCE: ${SMS_USER_REFERENCE:-teamip3-demo}
      DEMO_USER_ID: ${DEMO_USER_ID:-demo}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-password}
      DEMO_PHONE_NUMBER: ${DEMO_PHONE_NUMBER:-09001111101}
      DEMO_SMS_CODE: ${DEMO_SMS_CODE:-1234}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_database:/data
    init: true

volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_database:
