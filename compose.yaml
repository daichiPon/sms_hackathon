services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm start
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:3001
      WDS_SOCKET_PORT: "0"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    init: true
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      target: development
    command:
      - sh
      - -c
      - npm run db:generate && npx prisma migrate deploy && npm run start:dev
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: file:/data/dev.db
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_database:/data
    init: true

volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_database:
