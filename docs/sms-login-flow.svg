<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">SMS Login Flow</title>
  <desc id="desc">Presentation flow chart showing the React frontend, NestJS backend, Prisma database, and SMS provider steps for SMS verification login.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane-title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .backend { fill: #f0fdf4; stroke: #16a34a; }
      .db { fill: #fff7ed; stroke: #ea580c; }
      .sms { fill: #fdf2f8; stroke: #db2777; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .success { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .text { font: 600 18px Arial, sans-serif; fill: #111827; }
      .small { font: 500 15px Arial, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .retry-edge { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .edge-label { font: 700 14px Arial, sans-serif; fill: #334155; }
      .title { font: 800 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="70" y="58">SMS Login Verification Flow</text>
  <text class="subtitle" x="70" y="88">React frontend -> NestJS backend -> Prisma data store -> SMS API or mock sender</text>

  <rect class="lane" x="50" y="125" width="300" height="640" rx="16"/>
  <rect class="lane" x="385" y="125" width="350" height="640" rx="16"/>
  <rect class="lane" x="770" y="125" width="250" height="640" rx="16"/>
  <rect class="lane" x="1055" y="125" width="295" height="640" rx="16"/>

  <text class="lane-title" x="80" y="166">Frontend</text>
  <text class="lane-title" x="415" y="166">Backend</text>
  <text class="lane-title" x="800" y="166">Database</text>
  <text class="lane-title" x="1085" y="166">SMS Provider</text>

  <rect class="box" x="85" y="205" width="230" height="72"/>
  <text class="text" x="122" y="234">Enter ID +</text>
  <text class="text" x="118" y="258">password</text>

  <rect class="box" x="85" y="330" width="230" height="72"/>
  <text class="text" x="122" y="359">POST</text>
  <text class="small" x="130" y="382">/auth/login</text>

  <polygon class="decision" points="560,205 680,245 560,285 440,245"/>
  <text class="text" x="493" y="240">Credentials</text>
  <text class="text" x="522" y="263">valid?</text>

  <rect class="backend" x="445" y="330" width="230" height="72" rx="10"/>
  <text class="text" x="494" y="359">Create OTP</text>
  <text class="small" x="496" y="382">expires in 5 min</text>

  <rect class="db" x="800" y="330" width="190" height="72" rx="10"/>
  <text class="text" x="849" y="359">SmsCode</text>
  <text class="small" x="828" y="382">stored as unused</text>

  <rect class="sms" x="1088" y="330" width="230" height="72" rx="10"/>
  <text class="text" x="1133" y="359">Send SMS</text>
  <text class="small" x="1114" y="382">API or mock sender</text>

  <rect class="db" x="800" y="455" width="190" height="72" rx="10"/>
  <text class="text" x="861" y="484">SmsLog</text>
  <text class="small" x="826" y="507">delivery result</text>

  <rect class="box" x="85" y="455" width="230" height="72"/>
  <text class="text" x="119" y="484">Show verify</text>
  <text class="text" x="149" y="508">screen</text>

  <rect class="box" x="85" y="580" width="230" height="72"/>
  <text class="text" x="122" y="609">POST</text>
  <text class="small" x="109" y="632">/auth/verify-sms</text>

  <polygon class="decision" points="560,555 690,600 560,645 430,600"/>
  <text class="text" x="493" y="594">OTP valid</text>
  <text class="text" x="502" y="617">and match?</text>

  <rect class="success" x="800" y="580" width="190" height="72"/>
  <text class="text" x="844" y="609">Mark used</text>
  <text class="small" x="843" y="632">login success</text>

  <rect class="error" x="445" y="688" width="230" height="54"/>
  <text class="text" x="493" y="721">Show error</text>

  <path class="edge" d="M200 277 V321"/>
  <path class="edge" d="M315 366 H370 V245 H431"/>
  <path class="edge" d="M560 285 V321"/>
  <text class="edge-label" x="590" y="310">Yes</text>
  <path class="edge" d="M675 366 H790"/>
  <path class="edge" d="M990 366 H1078"/>
  <path class="edge" d="M1203 402 V491 H1000"/>
  <path class="edge" d="M800 491 H325"/>
  <path class="edge" d="M200 527 V571"/>
  <path class="edge" d="M315 616 H421"/>
  <path class="edge" d="M690 616 H790"/>
  <text class="edge-label" x="704" y="608">Yes</text>
  <path class="edge" d="M560 645 V679"/>
  <text class="edge-label" x="585" y="674">No</text>
  <path class="edge" d="M440 245 H410 V715 H436"/>
  <text class="edge-label" x="414" y="236">No</text>

  <rect x="70" y="775" width="1260" height="1" fill="#cbd5e1"/>
  <text class="small" x="70" y="802">Key failure cases: invalid ID/password, expired OTP, already-used OTP, wrong OTP, or SMS API error.</text>
</svg>
